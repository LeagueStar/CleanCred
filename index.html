<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CleanCred — Verified Waste Action & Green Credits Platform (SIH 2026)</title>
  <meta name="description" content="CleanCred: National Smart India Hackathon platform for verified municipal waste segregation, citizen tracking, and EPR Green Credits. Report → Verify → Collect → Record → Earn.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%200%20100%20100%22><circle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23059669%22 stroke=%22%23FFFFFF%22 stroke-width=%224%22/><text x=%2250%22 y=%2265%22 font-size=%2245%22 text-anchor=%22middle%22 fill=%22white%22>🌱</text></svg>">

  <!-- Tailwind CSS CDN (Utility Classes) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandGreen: '#059669',
            brandNavy: '#0F172A',
            brandBlue: '#0891B2',
            canvas: '#E0E5EC'
          },
          fontFamily: {
            heading: ['Outfit', 'sans-serif'],
            body: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for Map Views -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Design System Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Chart.js for Municipal Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- QR Code Generator & Scanner -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Floating Surreal Abstract Background Shapes -->
  <div class="surreal-blob surreal-blob-green" aria-hidden="true"></div>
  <div class="surreal-blob surreal-blob-cyan" aria-hidden="true"></div>
  <div class="surreal-blob surreal-blob-orange" aria-hidden="true"></div>

  <!-- Confetti Canvas Layer -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ==========================================================================
       TOP MUNICIPAL NAVIGATION BAR (SOLID MATTE NEUMORPHIC)
       ========================================================================== -->
  <header class="app-topbar">
    <div class="app-container topbar-content">
      
      <!-- Brand Logo Cluster -->
      <div class="brand-cluster" onclick="window.AppRouter.navigate('dashboard')">
        <div class="brand-icon-wrapper">
          <i data-lucide="leaf" style="width: 22px; height: 22px; stroke-width: 2.5;"></i>
        </div>
        <div>
          <div class="brand-title">
            <span>CleanCred</span>
            <span class="brand-badge">SBM-U 2.0</span>
          </div>
        </div>
      </div>

      <!-- Center 3-Role View Switcher (Lucide Controls) -->
      <div class="role-switcher-nav" id="main-role-switcher">
        <button class="role-tab-btn active" id="btn-mode-citizen" onclick="window.AppRouter.switchExperience('citizen')" title="Citizen Mobile Experience">
          <i data-lucide="user" class="lucide-icon"></i>
          <span>Citizen</span>
        </button>
        <button class="role-tab-btn" id="btn-mode-worker" onclick="window.AppRouter.switchExperience('worker')" title="Municipal Worker Portal">
          <i data-lucide="truck" class="lucide-icon"></i>
          <span>Worker</span>
        </button>
        <button class="role-tab-btn" id="btn-mode-admin" onclick="window.AppRouter.switchExperience('admin')" title="City Command Center">
          <i data-lucide="building-2" class="lucide-icon"></i>
          <span>Command</span>
        </button>
      </div>

      <!-- Right Action Cluster -->
      <div class="topbar-right-cluster">
        <div class="points-pill-top" id="topbar-user-points" onclick="window.AppRouter.navigate('rewards')" title="View Green Wallet & Rewards">
          <i data-lucide="coins" class="lucide-icon"></i>
          <span id="user-points-counter-top">1,250 GC</span>
        </div>
        <button class="topbar-profile-btn" id="btn-topbar-profile" onclick="window.AppRouter.navigate('profile')" title="Citizen Profile & Municipal KYC">
          <i data-lucide="user-check" class="lucide-icon-sm"></i>
          <span>Profile</span>
        </button>
        <button class="demo-reset-btn" id="btn-demo-reset" onclick="window.State.resetState()" title="Reset session to clean seed state">
          <i data-lucide="rotate-ccw" class="lucide-icon-sm"></i>
          <span>Reset</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ==========================================================================
       MAIN VIEW CONTAINERS (ALL ROUTES PERSISTED)
       ========================================================================== -->
  <main class="main-content">
    <!-- Citizen Mobile Home Experience -->
    <div id="view-dashboard" class="view-section active"></div>

    <!-- 5-Step Verified Waste Reporting Flow -->
    <div id="view-report-waste" class="view-section"></div>

    <!-- Municipal Worker Portal -->
    <div id="view-worker" class="view-section"></div>

    <!-- Municipal Admin Dashboard -->
    <div id="view-admin" class="view-section"></div>

    <!-- Fintech Green Wallet & Rewards -->
    <div id="view-rewards" class="view-section"></div>

    <!-- Live GPS & Status Tracking -->
    <div id="view-live-tracking" class="view-section"></div>

    <!-- Community Leaderboard -->
    <div id="view-leaderboard" class="view-section"></div>

    <!-- Environmental Impact Analytics -->
    <div id="view-impact" class="view-section"></div>

    <!-- Citizen Account & KYC Profile -->
    <div id="view-profile" class="view-section"></div>

    <!-- Illegal Dumping Hotline -->
    <div id="view-illegal-dumping" class="view-section"></div>

    <!-- Institution / School / Bulk Generator Portal -->
    <div id="view-institutions" class="view-section"></div>
  </main>

  <!-- Interactive Modal Container -->
  <div id="modal-scan-container" style="display: none;"></div>

  <!-- ES6 Module App Entrypoint -->
  <script type="module" src="js/app.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();
    });
  </script>
</body>
</html>
